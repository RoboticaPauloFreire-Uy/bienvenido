<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego — Colegio Paulo Freire</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-800: #2E7D32;
      --green-900: #1B5E20;
      --yellow:    #FBC02D;
      --topbar-h:  56px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #07090f;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Topbar compacto */
    .game-topbar {
      height: var(--topbar-h);
      background: var(--green-900);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 2px solid var(--yellow);
    }

    .game-topbar a {
      display: flex;
      align-items: center;
      gap: 7px;
      color: rgba(255,255,255,.8);
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.1);
      transition: background .15s;
    }
    .game-topbar a:hover { background: rgba(255,255,255,.2); color: #fff; }

    .game-topbar-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .game-topbar-title {
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.1;
    }
    .game-topbar-sub {
      font-size: .75rem;
      color: var(--yellow);
      font-weight: 700;
    }

    /* Área principal del juego */
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Loading */
    .game-loading {
      text-align: center;
      color: rgba(255,255,255,.5);
    }
    .game-loading .spin { font-size: 2rem; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .game-error {
      text-align: center;
      color: rgba(255,255,255,.6);
    }
    .game-error a {
      color: var(--yellow);
      font-weight: 800;
      text-decoration: underline;
    }

    /* Instrucciones pie */
    .game-footer {
      height: 36px;
      background: rgba(0,0,0,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: .78rem;
      color: rgba(255,255,255,.4);
      flex-shrink: 0;
      font-family: monospace;
    }

    .game-footer span { display: flex; align-items: center; gap: 5px; }

    /* Pantalla completa del canvas */
    #game-fullarea {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Herramientas Web (Pixel Art / Binary) */
    .tool-page-wrap {
      width: 100%;
      max-width: 720px;
      overflow-y: auto;
      max-height: 100%;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <div class="game-topbar">
    <a href="javascript:history.back()" id="back-btn">
      <i class="fas fa-arrow-left"></i> Volver
    </a>
    <div class="game-topbar-info">
      <div class="game-topbar-title" id="game-title">Cargando...</div>
      <div class="game-topbar-sub">Taller de Programación · Colegio Paulo Freire</div>
    </div>
    <div style="width:80px;"></div><!-- balanceo visual -->
  </div>

  <!-- Área del juego -->
  <div class="game-area">
    <div class="game-loading" id="loading-state">
      <div class="spin"><i class="fas fa-circle-notch"></i></div>
      <p style="margin-top:10px;">Cargando juego...</p>
    </div>
    <div id="game-fullarea" style="display:none;"></div>
  </div>

  <!-- Pie de instrucciones -->
  <div class="game-footer" id="game-footer" style="display:none;">
    <!-- Generado por JS según juego -->
  </div>

  <!-- Scripts de juegos -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/games/neon_runner.js"></script>
  <script src="js/games/retro_snake.js"></script>
  <script src="js/games/code_breaker.js"></script>
  <script src="js/games/dev_quiz.js"></script>
  <script src="js/games/tools.js"></script>
  <script src="js/juego.js"></script>
</body>
</html>
