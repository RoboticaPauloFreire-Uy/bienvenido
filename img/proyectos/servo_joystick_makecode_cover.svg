<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo tecnológico -->
    <linearGradient id="bgTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="85%" stop-color="#31104B"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>

    <!-- Gradiente MakeCode / micro:bit -->
    <linearGradient id="microbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00EE88"/>
      <stop offset="50%" stop-color="#00A0D0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Gradiente Joystick -->
    <radialGradient id="joyKnobGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Gradiente Servomotor Azul SG90 -->
    <linearGradient id="servoBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Gradiente Bloque Matemático MakeCode -->
    <linearGradient id="mathBlockGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Filtro sombra -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="800" height="480" fill="url(#bgTechGrad)"/>

  <!-- Cuadricula / Circuito esquemático de fondo -->
  <g opacity="0.12" stroke="#818CF8" stroke-width="1.2">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- Ondas y cables de señal luminosa -->
  <path d="M 220,180 C 300,120 340,260 430,210" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>
  <path d="M 430,210 C 500,170 540,240 600,190" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- ══════════════════════════════════════════════════
       COMPONENTE 1: JOYSTICK ANALÓGICO (IZQUIERDA ARRIBA)
       ══════════════════════════════════════════════════ -->
  <g transform="translate(90, 70)" filter="url(#cardShadow)">
    <!-- Base PCB del joystick -->
    <rect x="0" y="0" width="140" height="150" rx="14" fill="#0B1329" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="16" cy="16" r="4" fill="#64748B"/>
    <circle cx="124" cy="16" r="4" fill="#64748B"/>
    <circle cx="16" cy="134" r="4" fill="#64748B"/>
    <circle cx="124" cy="134" r="4" fill="#64748B"/>

    <!-- Pines del Joystick -->
    <g transform="translate(25, 136)">
      <rect x="0" y="0" width="12" height="18" fill="#F59E0B" rx="2"/>
      <rect x="22" y="0" width="12" height="18" fill="#F59E0B" rx="2"/>
      <rect x="44" y="0" width="12" height="18" fill="#F59E0B" rx="2"/>
      <rect x="66" y="0" width="12" height="18" fill="#F59E0B" rx="2"/>
      <text x="6" y="27" fill="#94A3B8" font-size="8" font-family="'Segoe UI', sans-serif">GND</text>
      <text x="28" y="27" fill="#94A3B8" font-size="8" font-family="'Segoe UI', sans-serif">VCC</text>
      <text x="50" y="27" fill="#38BDF8" font-size="8" font-weight="900" font-family="'Segoe UI', sans-serif">VRx</text>
      <text x="72" y="27" fill="#94A3B8" font-size="8" font-family="'Segoe UI', sans-serif">VRy</text>
    </g>

    <!-- Aro exterior del joystick -->
    <circle cx="70" cy="65" r="48" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    
    <!-- Ejes cardinales X / Y -->
    <line x1="28" y1="65" x2="112" y2="65" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="70" y1="23" x2="70" y2="107" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="116" y="68" fill="#38BDF8" font-size="10" font-weight="900" font-family="'Segoe UI', sans-serif">X</text>
    <text x="70" y="18" fill="#A855F7" font-size="10" font-weight="900" text-anchor="middle" font-family="'Segoe UI', sans-serif">Y</text>

    <!-- Palanca / Knob del Joystick inclinado hacia la derecha -->
    <circle cx="86" cy="54" r="32" fill="url(#joyKnobGrad)" stroke="#64748B" stroke-width="2"/>
    <circle cx="86" cy="54" r="22" fill="#334155" opacity="0.6"/>
    <circle cx="83" cy="50" r="12" fill="#475569" opacity="0.7"/>

    <!-- Flechas de movimiento del Joystick -->
    <path d="M 88,40 L 98,34 L 98,44 Z" fill="#38BDF8"/>
    <path d="M 98,54 L 108,54" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

    <!-- Etiqueta de lectura analógica -->
    <rect x="15" y="102" width="110" height="24" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="70" y="118" fill="#38BDF8" font-size="11" font-weight="900" text-anchor="middle" font-family="'Segoe UI', sans-serif">
      Lectura: 0 → 1023
    </text>
  </g>

  <!-- ══════════════════════════════════════════════════
       COMPONENTE 2: BLOQUE MATEMÁTICO MAKECODE (CENTRO)
       ══════════════════════════════════════════════════ -->
  <g transform="translate(265, 80)" filter="url(#cardShadow)">
    <!-- Bloque MakeCode Contenedor -->
    <path d="M 0,10 C 0,4 4,0 10,0 L 40,0 C 45,0 48,6 55,6 C 62,6 65,0 70,0 L 260,0 C 266,0 270,4 270,10 L 270,140 C 270,146 266,150 260,150 L 70,150 C 65,150 62,144 55,144 C 48,144 45,150 40,150 L 10,150 C 4,150 0,146 0,140 Z" fill="url(#mathBlockGrad)" stroke="#A78BFA" stroke-width="2"/>

    <!-- Cabecera del bloque -->
    <text x="18" y="26" fill="#FFFFFF" font-size="13" font-weight="900" font-family="'Segoe UI', Roboto, sans-serif">
      📐 AJUSTE DE INTERVALO (MAPEO)
    </text>

    <!-- Sub-bloque Variable: fijar angulo a -->
    <g transform="translate(14, 38)">
      <rect x="0" y="0" width="242" height="46" rx="8" fill="#4338CA" stroke="#818CF8" stroke-width="1.5"/>
      <text x="12" y="18" fill="#E0E7FF" font-size="11" font-weight="800" font-family="'Segoe UI', sans-serif">
        fijar <tspan fill="#FACC15" font-weight="900">ángulo</tspan> a
      </text>

      <!-- Bloque Matemático: mapear -->
      <g transform="translate(8, 22)">
        <rect x="0" y="0" width="226" height="20" rx="5" fill="#5B21B6"/>
        <text x="6" y="14" fill="#C4B5FD" font-size="9" font-weight="900" font-family="'Segoe UI', sans-serif">
          mapear <tspan fill="#38BDF8">P0 (0..1023)</tspan> a <tspan fill="#34D399">0..180°</tspan>
        </text>
      </g>
    </g>

    <!-- Sub-bloque Servo: escribir pin P2 -->
    <g transform="translate(14, 92)">
      <rect x="0" y="0" width="242" height="42" rx="8" fill="#1E1B4B" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="12" y="17" fill="#E0F2FE" font-size="11" font-weight="800" font-family="'Segoe UI', sans-serif">
        servomotor <tspan fill="#38BDF8" font-weight="900">escribir pin P2</tspan>
      </text>
      <g transform="translate(140, 6)">
        <rect x="0" y="0" width="90" height="24" rx="6" fill="#FACC15"/>
        <text x="45" y="16" fill="#0F172A" font-size="11" font-weight="900" text-anchor="middle" font-family="'Segoe UI', sans-serif">
          ángulo (°)
        </text>
      </g>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════
       COMPONENTE 3: SERVOMOTOR SG90 & ÁNGULOS (DERECHA)
       ══════════════════════════════════════════════════ -->
  <g transform="translate(565, 60)" filter="url(#cardShadow)">
    <!-- Transportador de ángulos / Dial de 0° a 180° -->
    <g transform="translate(90, 80)">
      <path d="M -75,0 A 75,75 0 0,1 75,0 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.85"/>
      <!-- Rayas angulares -->
      <line x1="-70" y1="0" x2="-60" y2="0" stroke="#FACC15" stroke-width="2"/>
      <text x="-70" y="-8" fill="#FACC15" font-size="9" font-weight="900">0°</text>
      <line x1="0" y1="-70" x2="0" y2="-60" stroke="#FACC15" stroke-width="2"/>
      <text x="0" y="-74" fill="#FACC15" font-size="9" font-weight="900" text-anchor="middle">90°</text>
      <line x1="70" y1="0" x2="60" y2="0" stroke="#FACC15" stroke-width="2"/>
      <text x="55" y="-8" fill="#FACC15" font-size="9" font-weight="900">180°</text>

      <!-- Arco de giro dinamico -->
      <path d="M -50,0 A 50,50 0 0,1 35,-35" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="4,4"/>
    </g>

    <!-- Cuerpo del Servomotor SG90 (Azul) -->
    <g transform="translate(45, 80)">
      <!-- Orejetas de montaje -->
      <rect x="-16" y="10" width="122" height="8" rx="2" fill="#0284C7"/>
      <circle x="-8" y="14" r="2.5" fill="#0F172A"/>
      <circle x="98" y="14" r="2.5" fill="#0F172A"/>

      <!-- Cuerpo principal -->
      <rect x="0" y="14" width="90" height="75" rx="6" fill="url(#servoBodyGrad)" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="45" y="55" fill="#E0F2FE" font-size="11" font-weight="900" text-anchor="middle" font-family="'Segoe UI', sans-serif">
        SG90
      </text>
      <text x="45" y="70" fill="#BAE6FD" font-size="9" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">
        Micro Servo
      </text>

      <!-- Eje y Brazo del Servo (Horn) -->
      <circle cx="45" cy="0" r="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="45" cy="0" r="6" fill="#64748B"/>

      <!-- Brazo blanco apuntando en 135° simulando giro proporcional -->
      <g transform="translate(45, 0) rotate(45)">
        <path d="M -8,0 L -5,-48 C -5,-52 5,-52 5,-48 L 8,0 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
        <circle cx="0" cy="-44" r="3" fill="#64748B"/>
        <circle cx="0" cy="-30" r="3" fill="#64748B"/>
        <circle cx="0" cy="-16" r="3" fill="#64748B"/>
      </g>

      <!-- Cable de 3 hilos (marrón, rojo, naranja) -->
      <path d="M 45,89 C 45,115 70,120 85,130" fill="none" stroke="#78350F" stroke-width="3"/>
      <path d="M 48,89 C 48,115 73,120 88,130" fill="none" stroke="#DC2626" stroke-width="3"/>
      <path d="M 51,89 C 51,115 76,120 91,130" fill="none" stroke="#F59E0B" stroke-width="3"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════
       TARJETA DE IDENTIFICACIÓN INFERIOR (PASOS CLAVE)
       ══════════════════════════════════════════════════ -->
  <g transform="translate(45, 275)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="710" height="175" rx="16" fill="#0B1329" opacity="0.95" stroke="#6366F1" stroke-width="2"/>
    
    <!-- Cinta superior gradiente -->
    <rect x="0" y="0" width="710" height="38" rx="16" fill="url(#microbitGrad)"/>
    <text x="355" y="24" fill="#0F172A" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">
      PROYECTO OFICIAL • 6° GRADO • NIVEL 2 • MAKECODE &amp; ROBÓTICA
    </text>

    <!-- Título Principal -->
    <text x="24" y="68" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">
      Control de Servomotor con Joystick y Ajuste de Intervalo Matemático 🕹️⚙️📐
    </text>

    <!-- 4 Pasos Didácticos en pastillas -->
    <g transform="translate(24, 88)">
      <!-- Paso 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="158" height="60" rx="10" fill="#1E1B4B" stroke="#4338CA" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#7C3AED"/>
        <text x="18" y="22" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">1</text>
        <text x="34" y="20" fill="#A5B4FC" font-size="11" font-weight="800">Conexión Pines</text>
        <text x="10" y="42" fill="#94A3B8" font-size="9.5">Joystick a P0 y Servo a P2 con micro:bit.</text>
      </g>

      <!-- Paso 2 -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="158" height="60" rx="10" fill="#0C2340" stroke="#0284C7" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#0284C7"/>
        <text x="18" y="22" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">2</text>
        <text x="34" y="20" fill="#38BDF8" font-size="11" font-weight="800">Lectura Analógica</text>
        <text x="10" y="42" fill="#94A3B8" font-size="9.5">El joystick entrega valores entre 0 y 1023.</text>
      </g>

      <!-- Paso 3 -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="158" height="60" rx="10" fill="#063528" stroke="#059669" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#059669"/>
        <text x="18" y="22" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">3</text>
        <text x="34" y="20" fill="#34D399" font-size="11" font-weight="800">Mapeo Matemático</text>
        <text x="10" y="42" fill="#94A3B8" font-size="9.5">Ajuste de intervalo: transformar 0-1023 a 0-180°.</text>
      </g>

      <!-- Paso 4 -->
      <g transform="translate(504, 0)">
        <rect x="0" y="0" width="158" height="60" rx="10" fill="#311B05" stroke="#D97706" stroke-width="1"/>
        <circle cx="18" cy="18" r="10" fill="#D97706"/>
        <text x="18" y="22" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">4</text>
        <text x="34" y="20" fill="#FBBF24" font-size="11" font-weight="800">Giro en Tiempo Real</text>
        <text x="10" y="42" fill="#94A3B8" font-size="9.5">El servo responde al instante con precisión angular.</text>
      </g>
    </g>
  </g>

  <!-- Partículas y destellos de simulación -->
  <g fill="#FACC15" filter="url(#neonGlow)">
    <circle cx="240" cy="50" r="3" fill="#38BDF8"/>
    <circle cx="550" cy="40" r="3" fill="#A855F7"/>
    <circle cx="500" cy="190" r="3.5" fill="#34D399"/>
    <circle cx="750" cy="130" r="4" fill="#FACC15"/>
  </g>
</svg>