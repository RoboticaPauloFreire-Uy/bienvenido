<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- AI Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="geminiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="neonDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle Neural Grid / Network Dots -->
  <g opacity="0.15">
    <circle cx="80" cy="80" r="2" fill="#818cf8"/>
    <circle cx="160" cy="80" r="2" fill="#818cf8"/>
    <circle cx="240" cy="80" r="2" fill="#818cf8"/>
    <circle cx="560" cy="80" r="2" fill="#818cf8"/>
    <circle cx="640" cy="80" r="2" fill="#818cf8"/>
    <circle cx="720" cy="80" r="2" fill="#818cf8"/>

    <circle cx="80" cy="160" r="2" fill="#818cf8"/>
    <circle cx="720" cy="160" r="2" fill="#818cf8"/>
    <circle cx="80" cy="240" r="2" fill="#818cf8"/>
    <circle cx="720" cy="240" r="2" fill="#818cf8"/>
    <circle cx="80" cy="320" r="2" fill="#818cf8"/>
    <circle cx="720" cy="320" r="2" fill="#818cf8"/>

    <line x1="80" y1="80" x2="240" y2="80" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="4,4"/>
    <line x1="560" y1="80" x2="720" y2="80" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="4,4"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="240" r="220" fill="url(#coreGlow)"/>

  <!-- Top Banner / Badge -->
  <g transform="translate(400, 48)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#neonDrop)"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="2">6&#176; GRADO &#8226; IA GENERATIVA &amp; NOTEBOOKLM</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="112" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="0.5">Creaci&#243;n Inteligente de Materiales de Estudio</text>
  <text x="400" y="136" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Transforma apuntes y fuentes en podcasts, videos, diapositivas y gu&#237;as con IA grounded</text>

  <!-- ================= LEFT: FUENTES (SOURCES) ================= -->
  <g transform="translate(50, 165)">
    <rect width="190" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="34" rx="14" fill="#1e293b"/>
    <text x="95" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">FUENTES CONFIABLES</text>
    
    <!-- Source Items -->
    <!-- PDF -->
    <g transform="translate(16, 48)">
      <rect width="158" height="36" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1"/>
      <rect x="8" y="7" width="22" height="22" rx="4" fill="#e11d48"/>
      <text x="19" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff">PDF</text>
      <text x="38" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Libros de Texto</text>
      <text x="38" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Cap&#237;tulos y manuales</text>
    </g>

    <!-- Docs / Apuntes -->
    <g transform="translate(16, 92)">
      <rect width="158" height="36" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1"/>
      <rect x="8" y="7" width="22" height="22" rx="4" fill="#2563eb"/>
      <text x="19" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="#ffffff">DOC</text>
      <text x="38" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Apuntes de Clase</text>
      <text x="38" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Res&#250;menes propios</text>
    </g>

    <!-- Web / Artículos -->
    <g transform="translate(16, 136)">
      <rect width="158" height="36" rx="8" fill="#1e293b" stroke="#059669" stroke-width="1"/>
      <rect x="8" y="7" width="22" height="22" rx="4" fill="#059669"/>
      <text x="19" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#ffffff">WEB</text>
      <text x="38" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Art&#237;culos Curados</text>
      <text x="38" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Cient&#237;ficos y prensa</text>
    </g>

    <!-- Grounding badge -->
    <g transform="translate(16, 182)">
      <rect width="158" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="79" y="17" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#6ee7b7">&#10004; ANCLAJE VERIFICABLE</text>
      <text x="79" y="28" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#a7f3d0">Cero alucinaciones de IA</text>
    </g>
  </g>

  <!-- Connecting Lines from Sources to Core -->
  <path d="M 240 220 C 280 220, 310 260, 350 260" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 240 280 C 280 280, 310 270, 350 270" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 240 330 C 280 330, 310 290, 350 280" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- ================= CENTER: GEMINI / NOTEBOOKLM AI CORE ================= -->
  <g transform="translate(400, 270)">
    <!-- Outer Rings -->
    <circle cx="0" cy="0" r="62" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#neonDrop)"/>
    <circle cx="0" cy="0" r="50" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,3"/>
    
    <!-- Gemini 4-Point Star Sparkle -->
    <path d="M 0 -36 C 2 -10, 10 -2, 36 0 C 10 2, 2 10, 0 36 C -2 10, -10 2, -36 0 C -10 -2, -2 -10, 0 -36 Z" fill="url(#geminiSparkle)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>

    <!-- Core Label -->
    <text x="0" y="78" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#c7d2fe" letter-spacing="1">NOTEBOOKLM</text>
    <text x="0" y="92" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#818cf8">Gemini 1.5 Pro Core</text>
  </g>

  <!-- Connecting Lines from Core to Outputs -->
  <path d="M 450 250 C 490 250, 510 195, 545 195" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 455 265 C 495 265, 510 255, 545 255" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 455 285 C 495 285, 510 315, 545 315" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M 450 300 C 490 300, 510 375, 545 375" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- ================= RIGHT: SALIDAS / GENERACIONES MULTIMODAL ================= -->
  <g transform="translate(545, 160)">
    
    <!-- Item 1: Podcast / Audio Overview -->
    <g transform="translate(0, 0)">
      <rect width="205" height="54" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" filter="url(#pinkGlow)"/>
      <rect x="8" y="10" width="34" height="34" rx="8" fill="#831843"/>
      <!-- Mic / Wave icon -->
      <text x="25" y="32" text-anchor="middle" font-size="18">&#127897;&#65039;</text>
      <text x="50" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fce7f3">Podcast (Audio Overview)</text>
      <text x="50" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fbcfe8">2 locutores debatiendo temas</text>
    </g>

    <!-- Item 2: Videos & Guiones -->
    <g transform="translate(0, 60)">
      <rect width="205" height="54" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" filter="url(#cyanGlow)"/>
      <rect x="8" y="10" width="34" height="34" rx="8" fill="#164e63"/>
      <!-- Clapper / Video icon -->
      <text x="25" y="32" text-anchor="middle" font-size="18">&#128253;&#65039;</text>
      <text x="50" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#cffafe">Guiones para Videos</text>
      <text x="50" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a5f3fc">Estructura gancho y escenas</text>
    </g>

    <!-- Item 3: Presentación / Slides -->
    <g transform="translate(0, 120)">
      <rect width="205" height="54" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="8" y="10" width="34" height="34" rx="8" fill="#78350f"/>
      <!-- Slides icon -->
      <text x="25" y="32" text-anchor="middle" font-size="18">&#128202;</text>
      <text x="50" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fef3c7">Diapositivas y Slides</text>
      <text x="50" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#fde68a">Esquemas listos para Canva</text>
    </g>

    <!-- Item 4: Guía de Estudio & FAQs -->
    <g transform="translate(0, 180)">
      <rect width="205" height="54" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="8" y="10" width="34" height="34" rx="8" fill="#064e3b"/>
      <!-- Doc / Quiz icon -->
      <text x="25" y="32" text-anchor="middle" font-size="18">&#128221;</text>
      <text x="50" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#d1fae5">Gu&#237;a de Estudio &amp; Quizzes</text>
      <text x="50" y="39" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#a7f3d0">Preguntas FAQ y flashcards</text>
    </g>
  </g>

  <!-- Bottom Footer Bar -->
  <g transform="translate(0, 442)">
    <rect width="800" height="38" fill="#0b1120"/>
    <text x="30" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b">Rob&#243;tica &amp; Pensamiento Computacional &#8226; Escuela Paulo Freire</text>
    <text x="770" y="24" text-anchor="end" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#818cf8">Nivel 3 &#8226; IA Aplicada al Aprendizaje</text>
  </g>
</svg>
