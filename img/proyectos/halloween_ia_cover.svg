<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Spooky Halloween Night -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080312"/>
      <stop offset="45%" stop-color="#180b2a"/>
      <stop offset="85%" stop-color="#2a0d1e"/>
      <stop offset="100%" stop-color="#3d1405"/>
    </linearGradient>

    <!-- Pumpkin / Orange Magic Glow -->
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080312" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple Mist Glow -->
    <radialGradient id="purpleMist" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#6b21a8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080312" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="polaroidBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="geminiSparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="orangeDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.6"/>
    </filter>
    <filter id="purpleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#c084fc" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Atmospheric Glows -->
  <circle cx="240" cy="200" r="280" fill="url(#purpleMist)"/>
  <circle cx="560" cy="240" r="260" fill="url(#magicGlow)"/>

  <!-- Spooky Stars / Magic Embers -->
  <g opacity="0.6">
    <circle cx="120" cy="60" r="2" fill="#fed7aa"/>
    <circle cx="220" cy="40" r="1.5" fill="#fde047"/>
    <circle cx="340" cy="70" r="2" fill="#e9d5ff"/>
    <circle cx="680" cy="50" r="2" fill="#fdba74"/>
    <circle cx="750" cy="110" r="1.5" fill="#fed7aa"/>
    <circle cx="90" cy="160" r="1.5" fill="#fbcfe8"/>
    <circle cx="710" cy="220" r="2" fill="#fde047"/>
  </g>

  <!-- Left: Polaroid Card (Canva Style) -->
  <g transform="translate(110, 110) rotate(-6)" filter="url(#cardShadow)">
    <!-- White Polaroid Frame -->
    <rect width="210" height="260" rx="10" fill="url(#polaroidBorder)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Photo Area inside Polaroid -->
    <rect x="15" y="15" width="180" height="180" rx="4" fill="#180b2a"/>
    <!-- Creature inside Photo -->
    <g transform="translate(15, 15)">
      <!-- Background Spooky Room -->
      <path d="M0,0 L180,0 L180,180 L0,180 Z" fill="#0f071e"/>
      <rect x="40" y="20" width="100" height="130" fill="#2d124d" opacity="0.4" rx="6"/>
      <!-- Window with moonlight -->
      <rect x="110" y="30" width="40" height="60" fill="#fef08a" opacity="0.3" rx="2"/>
      <line x1="130" y1="30" x2="130" y2="90" stroke="#180b2a" stroke-width="2"/>
      <line x1="110" y1="60" x2="150" y2="60" stroke="#180b2a" stroke-width="2"/>
      <!-- Monster Silhouette / Transformation -->
      <circle cx="90" cy="85" r="32" fill="#7c3aed"/>
      <path d="M60,110 Q90,75 120,110 L135,180 L45,180 Z" fill="#581c87"/>
      <!-- Glowing Eyes -->
      <circle cx="82" cy="82" r="4" fill="#f97316"/>
      <circle cx="98" cy="82" r="4" fill="#f97316"/>
      <circle cx="82" cy="82" r="1.5" fill="#fef08a"/>
      <circle cx="98" cy="82" r="1.5" fill="#fef08a"/>
      <!-- Magic Sparkle -->
      <path d="M140,40 L144,48 L152,52 L144,56 L140,64 L136,56 L128,52 L136,48 Z" fill="#fde047" opacity="0.8"/>
    </g>
    <!-- Polaroid Handwritten Label -->
    <text x="105" y="222" font-family="'Brush Script MT', cursive, sans-serif" font-size="16" fill="#1e1b4b" text-anchor="middle" font-weight="bold">🎃 Halloween 2026</text>
    <text x="105" y="242" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Canva &bull; Recuerdo Impreso</text>
  </g>

  <!-- Right: Video / Flow Animatic Card -->
  <g transform="translate(480, 110) rotate(5)" filter="url(#cardShadow)">
    <rect width="230" height="170" rx="14" fill="#0f172a" stroke="#7c3aed" stroke-width="2.5"/>
    <!-- Film Strip Header -->
    <rect x="0" y="0" width="230" height="26" rx="12" fill="#1e1b4b"/>
    <circle cx="20" cy="13" r="4" fill="#ef4444"/>
    <circle cx="34" cy="13" r="4" fill="#f59e0b"/>
    <circle cx="48" cy="13" r="4" fill="#10b981"/>
    <text x="125" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#e2e8f0" font-weight="bold" text-anchor="middle">FLOW &bull; Video IA</text>
    
    <!-- Screen Area -->
    <rect x="10" y="34" width="210" height="124" rx="8" fill="#020617"/>
    <!-- Monster Video Scene -->
    <path d="M10,34 L220,34 L220,158 L10,158 Z" fill="#1e0a38" opacity="0.6"/>
    <!-- Play Button Icon Center -->
    <circle cx="115" cy="96" r="26" fill="rgba(249, 115, 22, 0.85)" filter="url(#orangeDrop)"/>
    <polygon points="110,85 127,96 110,107" fill="#ffffff"/>
    
    <!-- Video timeline bar -->
    <rect x="20" y="142" width="190" height="5" rx="2.5" fill="#334155"/>
    <rect x="20" y="142" width="95" height="5" rx="2.5" fill="#f97316"/>
    <circle cx="115" cy="144.5" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Center Magic Elements: Spellbook / Gemini Portal -->
  <g transform="translate(330, 190)" filter="url(#purpleDrop)">
    <!-- Book of Spells Badge -->
    <rect x="10" y="20" width="120" height="150" rx="12" fill="#3b0764" stroke="#eab308" stroke-width="2.5"/>
    <!-- Book Spines -->
    <path d="M22,25 L22,165" stroke="#ca8a04" stroke-width="3"/>
    <!-- Magic Skull / Star Emblem -->
    <circle cx="70" cy="75" r="28" fill="#581c87" stroke="#eab308" stroke-width="1.5"/>
    <text x="70" y="83" font-size="28" text-anchor="middle">📖</text>
    <text x="70" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#fef08a" font-weight="900" text-anchor="middle">LIBRO DE</text>
    <text x="70" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#fef08a" font-weight="900" text-anchor="middle">HECHIZOS</text>
    <text x="70" y="152" font-family="system-ui, sans-serif" font-size="8" fill="#e9d5ff" text-anchor="middle">5 Capas IA</text>
  </g>

  <!-- Big Glowing Jack-o-Lantern Bottom Center -->
  <g transform="translate(365, 360)" filter="url(#orangeDrop)">
    <!-- Pumpkin Body -->
    <ellipse cx="35" cy="40" rx="42" ry="34" fill="#ea580c"/>
    <ellipse cx="35" cy="40" rx="30" ry="34" fill="#f97316"/>
    <ellipse cx="35" cy="40" rx="16" ry="34" fill="#fb923c"/>
    <!-- Stem -->
    <path d="M32,8 C30,-2 40,-6 44,-2 C41,3 38,7 38,8 Z" fill="#15803d"/>
    <!-- Carved Face (Glowing Yellow) -->
    <polygon points="20,30 29,30 24.5,22" fill="#fef08a"/>
    <polygon points="41,30 50,30 45.5,22" fill="#fef08a"/>
    <polygon points="35,36 32,42 38,42" fill="#fef08a"/>
    <!-- Tooth smile -->
    <path d="M18,48 Q35,62 52,48 Q46,55 35,55 Q24,55 18,48 Z" fill="#fef08a"/>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 52)" text-anchor="middle">
    <!-- Mini Badge -->
    <rect x="-140" y="-32" width="280" height="26" rx="13" fill="rgba(124, 58, 237, 0.4)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e9d5ff" font-weight="bold" letter-spacing="1.5">
      🎃 TALLER DE ROBÓTICA FREIREBOT &bull; 5° Y 6°
    </text>
    
    <!-- Main Title -->
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#ffffff" font-weight="900" letter-spacing="0.5">
      Especial Halloween con Inteligencia Artificial
    </text>
    <text x="0" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#fed7aa" font-weight="600">
      Foto a Monstruo en Gemini &bull; Postal Polaroid en Canva &bull; Video Animado en Flow
    </text>
  </g>
</svg>
