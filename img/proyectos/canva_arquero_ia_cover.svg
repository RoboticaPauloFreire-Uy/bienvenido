<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo estadio tecnologico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="80%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <!-- Gradiente cancha -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Gradiente Canva / IA Magic Studio -->
    <linearGradient id="canvaMagic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Resplandor pelota IA -->
    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#EF4444" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Estadio Cibernetico -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Lineas de cuadricula digital / IA Matrix -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="300" y1="0" x2="300" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="500" y1="0" x2="500" y2="480"/>
    <line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="700" y1="0" x2="700" y2="480"/>
  </g>

  <!-- Cesped del Estadio en perspectiva -->
  <polygon points="0,320 800,320 800,480 0,480" fill="url(#grassGrad)"/>
  <ellipse cx="400" cy="400" rx="360" ry="60" fill="none" stroke="#A7F3D0" stroke-width="3" opacity="0.4"/>
  <line x1="400" y1="320" x2="400" y2="480" stroke="#FFF" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="320" x2="800" y2="320" stroke="#FFF" stroke-width="4" opacity="0.6"/>

  <!-- Arco de Futbol con Red -->
  <g opacity="0.75" filter="url(#shadow)">
    <!-- Postes y Travesano del Arco -->
    <path d="M 160,340 L 160,150 L 640,150 L 640,340" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Profundidad del arco -->
    <path d="M 160,150 L 220,110 L 580,110 L 640,150" fill="none" stroke="#E2E8F0" stroke-width="7"/>
    <path d="M 220,110 L 220,320" fill="none" stroke="#CBD5E1" stroke-width="5"/>
    <path d="M 580,110 L 580,320" fill="none" stroke="#CBD5E1" stroke-width="5"/>
    <!-- Trama de red -->
    <g stroke="#FFFFFF" stroke-width="1" opacity="0.3">
      <line x1="160" y1="180" x2="220" y2="150"/><line x1="160" y1="220" x2="220" y2="190"/><line x1="160" y1="260" x2="220" y2="230"/><line x1="160" y1="300" x2="220" y2="270"/>
      <line x1="640" y1="180" x2="580" y2="150"/><line x1="640" y1="220" x2="580" y2="190"/><line x1="640" y1="260" x2="580" y2="230"/><line x1="640" y1="300" x2="580" y2="270"/>
      <line x1="220" y1="110" x2="220" y2="320"/><line x1="280" y1="110" x2="280" y2="320"/><line x1="340" y1="110" x2="340" y2="320"/>
      <line x1="400" y1="110" x2="400" y2="320"/><line x1="460" y1="110" x2="460" y2="320"/><line x1="520" y1="110" x2="520" y2="320"/><line x1="580" y1="110" x2="580" y2="320"/>
    </g>
  </g>

  <!-- Marco de Canva / Template UI (Ventana de Edicion) -->
  <g transform="translate(60, 40)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="42" rx="10" fill="#1E293B" opacity="0.95"/>
    <circle cx="20" cy="21" r="6" fill="#EF4444"/>
    <circle cx="38" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="6" fill="#10B981"/>
    <rect x="80" y="8" width="130" height="26" rx="6" fill="url(#canvaMagic)"/>
    <text x="145" y="25" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">CANVA • IA STUDIO</text>
    <rect x="220" y="8" width="80" height="26" rx="6" fill="#334155"/>
    <text x="260" y="25" fill="#38BDF8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✨ Animar IA</text>
  </g>

  <!-- Pistas de IA / Magic Animation Waves hacia el arquero -->
  <g opacity="0.6">
    <path d="M 220,120 Q 320,180 430,220" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M 240,140 Q 350,210 470,250" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="6 4"/>
    <path d="M 260,160 Q 380,240 510,270" fill="none" stroke="#F43F5E" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Silueta del Arquero en Vuelo Atajando con IA (Centro-Derecha) -->
  <g transform="translate(380, 160)" filter="url(#shadow)">
    <ellipse cx="60" cy="180" rx="90" ry="18" fill="#022C22" opacity="0.45"/>

    <!-- Efecto resplandor de IA alrededor del cuerpo -->
    <g filter="url(#glowEffect)" opacity="0.5">
      <path d="M 20,40 Q 60,30 90,65 L 140,80 L 175,65 Q 190,85 165,110 L 120,115 L 75,130 L 40,160 L 0,150 L 30,110 Z" fill="#38BDF8"/>
    </g>

    <!-- Torso con Buzo de Arquero (Celeste y Azul Marino Freire) -->
    <path d="M 30,55 L 75,45 L 115,75 L 85,120 L 45,110 Z" fill="#0284C7"/>
    <path d="M 50,52 L 75,45 L 95,65 L 70,115 Z" fill="#0369A1"/>
    <!-- Escudo Freire en el pecho -->
    <circle cx="68" cy="72" r="9" fill="#FBC02D"/>
    <circle cx="68" cy="72" r="7" fill="#15803D"/>
    <text x="68" y="75" fill="#FFF" font-size="7" font-weight="900" text-anchor="middle">PF</text>

    <!-- Cabeza del alumno (fotografia integrada en la plantilla) -->
    <circle cx="45" cy="35" r="22" fill="#FDBA74"/>
    <path d="M 25,32 Q 40,12 65,22 Q 62,38 52,38 Q 38,35 25,32 Z" fill="#78350F"/>
    <circle cx="56" cy="32" r="3" fill="#1E293B"/>
    <circle cx="57" cy="31" r="1" fill="#FFF"/>
    <path d="M 50,42 Q 56,46 62,41" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>

    <!-- Brazo Izquierdo extendido hacia la pelota con Guante de Arquero -->
    <path d="M 95,65 L 155,50 L 175,42" fill="none" stroke="#0284C7" stroke-width="18" stroke-linecap="round"/>
    <g transform="translate(170, 32)">
      <rect x="0" y="0" width="28" height="24" rx="8" fill="#F97316"/>
      <rect x="5" y="4" width="18" height="16" rx="4" fill="#FFFFFF"/>
      <line x1="8" y1="9" x2="20" y2="9" stroke="#EA580C" stroke-width="2"/>
      <line x1="8" y1="15" x2="20" y2="15" stroke="#EA580C" stroke-width="2"/>
    </g>

    <!-- Brazo Derecho de apoyo -->
    <path d="M 30,60 L 5,80 L -15,100" fill="none" stroke="#0369A1" stroke-width="16" stroke-linecap="round"/>
    <rect x="-30" y="92" width="24" height="22" rx="7" fill="#F97316"/>

    <!-- Pierna Izquierda en extension de salto -->
    <path d="M 75,115 L 110,145 L 140,170" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    <path d="M 135,165 L 165,172 L 155,182 L 130,175 Z" fill="#E11D48"/>

    <!-- Pierna Derecha flexionada en el aire -->
    <path d="M 45,110 L 25,145 L 45,168" fill="none" stroke="#0F172A" stroke-width="16" stroke-linecap="round"/>
    <path d="M 40,165 L 62,174 L 56,182 L 35,172 Z" fill="#E11D48"/>
  </g>

  <!-- Pelota de Futbol Oficial con Estela de Animacion IA -->
  <g transform="translate(585, 175)" filter="url(#shadow)">
    <circle cx="20" cy="20" r="55" fill="url(#ballGlow)"/>

    <!-- Estela de movimiento IA (Magic Trail) -->
    <path d="M -15,10 Q -45,-5 -85,15" fill="none" stroke="#FACC15" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -10,25 Q -50,20 -95,45" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M -12,35 Q -40,50 -75,70" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Pelota Clasica -->
    <circle cx="20" cy="20" r="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <polygon points="20,8 29,15 25,26 15,26 11,15" fill="#0F172A"/>
    <polygon points="20,3 15,-5 25,-5" fill="#0F172A" opacity="0.8"/>
    <polygon points="35,14 42,9 43,19" fill="#0F172A" opacity="0.8"/>
    <polygon points="32,30 40,33 34,41" fill="#0F172A" opacity="0.8"/>
    <polygon points="8,30 0,33 6,41" fill="#0F172A" opacity="0.8"/>
    <polygon points="5,14 -2,9 -3,19" fill="#0F172A" opacity="0.8"/>
  </g>

  <!-- Tarjeta de Identificacion / Insignia del Taller (Izquierda Abajo) -->
  <g transform="translate(45, 290)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="145" rx="14" fill="#0F172A" opacity="0.92" stroke="#38BDF8" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="310" height="34" rx="14" fill="url(#canvaMagic)"/>
    <text x="155" y="22" fill="#FFFFFF" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">
      PROYECTO OFICIAL • 6° GRADO • NIVEL 1
    </text>

    <text x="18" y="60" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900">
      El Arquero con IA en Canva ⚽🧤
    </text>

    <g transform="translate(18, 76)">
      <circle cx="12" cy="12" r="12" fill="#0284C7"/>
      <text x="12" y="16" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">1</text>
      <text x="32" y="15" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Foto Pose Arquero</text>

      <circle cx="150" cy="12" r="12" fill="#8B5CF6"/>
      <text x="150" y="16" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">2</text>
      <text x="170" y="15" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Plantilla Canva</text>

      <circle cx="12" cy="40" r="12" fill="#EC4899"/>
      <text x="12" y="44" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">3</text>
      <text x="32" y="43" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Quitafondos IA</text>

      <circle cx="150" cy="40" r="12" fill="#10B981"/>
      <text x="150" y="44" fill="#FFF" font-size="10" font-weight="900" text-anchor="middle">4</text>
      <text x="170" y="43" fill="#E2E8F0" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">Animación con IA ✨</text>
    </g>
  </g>

  <!-- Chispas y Estrellas de Inteligencia Artificial (Canva Magic Sparks) -->
  <g fill="#FACC15" filter="url(#glowEffect)">
    <path d="M 720,70 Q 720,85 735,85 Q 720,85 720,100 Q 720,85 705,85 Q 720,85 720,70 Z"/>
    <path d="M 370,90 Q 370,100 380,100 Q 370,100 370,110 Q 370,100 360,100 Q 370,100 370,90 Z" fill="#38BDF8"/>
    <path d="M 640,280 Q 640,292 652,292 Q 640,292 640,304 Q 640,292 628,292 Q 640,292 640,280 Z" fill="#F43F5E"/>
    <path d="M 120,240 Q 120,248 128,248 Q 120,248 120,256 Q 120,248 112,248 Q 120,248 120,240 Z" fill="#A855F7"/>
  </g>
</svg>