<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    
    <!-- Book Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Origami Fold Gradients -->
    <linearGradient id="origamiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="origamiFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="strawHat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="hatBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.1" stroke="#451A03" stroke-width="1.5">
    <path d="M0,50 H600 M0,100 H600 M0,150 H600 M0,200 H600 M0,250 H600 M0,300 H600 M0,350 H600 M0,400 H600 M0,450 H600 M0,500 H600 M0,550 H600" />
    <path d="M50,0 V600 M100,0 V600 M150,0 V600 M200,0 V600 M250,0 V600 M300,0 V600 M350,0 V600 M400,0 V600 M450,0 V600 M500,0 V600 M550,0 V600" />
  </g>

  <!-- Book Page in Background -->
  <g filter="url(#dropShadow)">
    <path d="M80,80 L520,80 Q530,80 530,90 L530,520 Q530,530 520,530 L80,530 Q70,530 70,520 L70,90 Q70,80 80,80 Z" fill="url(#pageGrad)" stroke="#CBD5E1" stroke-width="2" />
    <!-- Book lines of text -->
    <g opacity="0.25" stroke="#475569" stroke-width="4" stroke-linecap="round">
      <line x1="120" y1="130" x2="360" y2="130" />
      <line x1="120" y1="160" x2="330" y2="160" />
      <line x1="120" y1="190" x2="300" y2="190" />
      <line x1="120" y1="220" x2="280" y2="220" />
      <line x1="120" y1="250" x2="340" y2="250" />
      <line x1="120" y1="280" x2="370" y2="280" />
      <line x1="120" y1="310" x2="480" y2="310" />
      <line x1="120" y1="340" x2="480" y2="340" />
      <line x1="120" y1="370" x2="480" y2="370" />
      <line x1="120" y1="400" x2="480" y2="400" />
      <line x1="120" y1="430" x2="450" y2="430" />
      <line x1="120" y1="460" x2="380" y2="460" />
    </g>
  </g>

  <!-- ORIGAMI CORNER BOOKMARK (Calzado en la esquina superior derecha del libro) -->
  <g filter="url(#dropShadow)">
    <!-- Base triangle / Pocket (Corner Sleeve) -->
    <!-- Fits right over the top-right corner (x: 530, y: 80) -->
    <path d="M290,80 L530,80 L530,320 Z" fill="url(#origamiRed)" stroke="#B91C1C" stroke-width="2" />
    <!-- Flaps origami pocket folds -->
    <path d="M290,80 L410,200 L530,80 Z" fill="#DC2626" opacity="0.9" />
    <path d="M410,200 L530,320 L530,80 Z" fill="url(#origamiFlap)" />
    <!-- Origami center diagonal crease -->
    <line x1="290" y1="80" x2="530" y2="320" stroke="#7F1D1D" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6" />
    
    <!-- Copper tape circuit paths (Cinta de cobre) -->
    <path d="M410,200 L440,240 L490,240" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M490,240 L490,275" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    <path d="M380,170 L350,140 L350,105" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Coin Battery (Pila botón CR2032) slot -->
    <g transform="translate(485, 275)">
      <circle cx="0" cy="0" r="22" fill="#E2E8F0" stroke="#94A3B8" stroke-width="3" />
      <text x="0" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#475569" text-anchor="middle">CR2032</text>
      <text x="0" y="-8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10" fill="#2563EB" text-anchor="middle">3V +</text>
    </g>
  </g>

  <!-- TOM SAWYER ILLUSTRATION (En el centro del marca-libro) -->
  <g transform="translate(385, 125)">
    <!-- Face / Head -->
    <circle cx="0" cy="42" r="38" fill="#FED7AA" stroke="#EA580C" stroke-width="2.5" />
    <!-- Cheeks (Blush) -->
    <ellipse cx="-22" cy="48" rx="8" ry="5" fill="#FCA5A5" opacity="0.6" />
    <ellipse cx="22" cy="48" rx="8" ry="5" fill="#FCA5A5" opacity="0.6" />
    <!-- Freckles (Pecas de Tom Sawyer) -->
    <circle cx="-20" cy="42" r="1.5" fill="#C2410C" />
    <circle cx="-24" cy="45" r="1.5" fill="#C2410C" />
    <circle cx="-17" cy="46" r="1.5" fill="#C2410C" />
    <circle cx="20" cy="42" r="1.5" fill="#C2410C" />
    <circle cx="24" cy="45" r="1.5" fill="#C2410C" />
    <circle cx="17" cy="46" r="1.5" fill="#C2410C" />
    <!-- Eyes -->
    <ellipse cx="-14" cy="38" rx="4.5" ry="6.5" fill="#1E293B" />
    <ellipse cx="14" cy="38" rx="4.5" ry="6.5" fill="#1E293B" />
    <circle cx="-12" cy="35" r="2" fill="#FFFFFF" />
    <circle cx="16" cy="35" r="2" fill="#FFFFFF" />
    <!-- Friendly Smile -->
    <path d="M-10,54 Q0,65 10,54" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round" />
    
    <!-- TOM SAWYER'S STRAW HAT (Gorro de Paja con Cinta Azul) -->
    <g transform="translate(0, 5)">
      <!-- Hat Brim (Ala del sombrero) -->
      <ellipse cx="0" cy="0" rx="68" ry="20" fill="url(#strawHat)" stroke="#854D0E" stroke-width="3" />
      <path d="M-60, -2 Q0, -12 60, -2" fill="none" stroke="#CA8A04" stroke-width="2" stroke-dasharray="4,3" />
      <!-- Hat Crown (Copa del sombrero) -->
      <path d="M-36,-4 C-36,-38 -28,-48 0,-48 C28,-48 36,-38 36,-4 Z" fill="url(#strawHat)" stroke="#854D0E" stroke-width="3" />
      <!-- Blue Ribbon (Cinta azul del sombrero) -->
      <path d="M-36,-6 Q0,-14 36,-6 L35, -16 Q0, -24 -35, -16 Z" fill="url(#hatBand)" />
      <!-- Weave textures on crown -->
      <path d="M-22,-40 Q0,-46 22,-40 M-28,-30 Q0,-38 28,-30" fill="none" stroke="#CA8A04" stroke-width="2" stroke-linecap="round" opacity="0.6" />

      <!-- FLAT LED (LED CHATO SMD) EN EL MEDIO DEL GORRO DE TOM SAWYER -->
      <g transform="translate(0, -32)">
        <!-- Outer Glowing Aura -->
        <circle cx="0" cy="0" r="36" fill="url(#ledGlow)" filter="url(#glowFilter)" />
        <circle cx="0" cy="0" r="22" fill="#FEF08A" opacity="0.8" filter="url(#glowFilter)" />
        
        <!-- Light Rays / Brillo radiante -->
        <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
          <line x1="0" y1="-28" x2="0" y2="-18" />
          <line x1="0" y1="18" x2="0" y2="28" />
          <line x1="-28" y1="0" x2="-18" y2="0" />
          <line x1="18" y1="0" x2="28" y2="0" />
          <line x1="-20" y1="-20" x2="-13" y2="-13" />
          <line x1="13" y1="13" x2="20" y2="20" />
          <line x1="20" y1="-20" x2="13" y2="-13" />
          <line x1="-13" y1="13" x2="-20" y2="20" />
        </g>
        
        <!-- The Flat SMD LED Component (LED Chato Cuadrado) -->
        <rect x="-10" y="-8" width="20" height="16" rx="3" fill="#FFFBEB" stroke="#D97706" stroke-width="2" />
        <!-- Chip core emitting intense bright white/yellow light -->
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="8" fill="#FACC15" opacity="0.8" />
        <!-- Contact pads solder -->
        <rect x="-12" y="-5" width="2.5" height="10" rx="1" fill="#94A3B8" />
        <rect x="9.5" y="-5" width="2.5" height="10" rx="1" fill="#94A3B8" />
        
        <!-- Label "LED CHATO" -->
        <rect x="-35" y="-48" width="70" height="18" rx="9" fill="#1E293B" opacity="0.9" />
        <text x="0" y="-35" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#FDE047" text-anchor="middle">💡 LED CHATO</text>
      </g>
    </g>
  </g>

  <!-- Interactive Callout / Press Button Badge -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="400" height="70" rx="16" fill="#1E1B4B" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="400" height="70" rx="16" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,6" />
    <circle cx="45" cy="35" r="22" fill="#F59E0B" />
    <!-- Hand click icon -->
    <text x="45" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" fill="#1E1B4B" text-anchor="middle">👆</text>
    <text x="80" y="30" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">¡Presioná para encender la luz!</text>
    <text x="80" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#FDE68A">Circuito con papel glacé doblado en la esquina del libro</text>
  </g>

  <!-- Top Ribbon Badge -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="240" height="38" rx="19" fill="#B45309" opacity="0.95" />
    <text x="120" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">📖 1° GRADO • PROYECTO MAKER</text>
  </g>
</svg>
